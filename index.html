<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ Наше созвездие · 29.05</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Share+Tech+Mono&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- СЕКРЕТНАЯ ЗВЁЗДОЧКА -->
    <button id="dev-skip-btn" class="dev-star" title="Пропустить ожидание">✦</button>
    
    <canvas id="bg-canvas"></canvas>
    <div class="vignette"></div>
    <div class="bg-aurora"></div>
    
    <div id="cursor"></div>
    <div id="cursor-ring"></div>
    
    <!-- ЭКРАН 1: СОЗВЕЗДИЕ -->
    <section id="constellation-screen" class="screen active">
        
        <div class="instruction">
            <span class="instruction-text">Соедини звёзды</span>
            <span class="instruction-sub">Нажимай на сияющие звёзды по порядку</span>
        </div>
        
        <svg id="constellation-svg" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid meet">
            <g id="lines-group"></g>
            <g id="stars-group">
                <circle class="star-node" cx="400" cy="620" r="6" data-month="12" data-name="Декабрь"/>
                <circle class="star-node" cx="310" cy="540" r="6" data-month="11" data-name="Ноябрь"/>
                <circle class="star-node" cx="230" cy="430" r="6" data-month="10" data-name="Октябрь"/>
                <circle class="star-node" cx="200" cy="310" r="6" data-month="9" data-name="Сентябрь"/>
                <circle class="star-node" cx="240" cy="190" r="6" data-month="8" data-name="Август"/>
                <circle class="star-node" cx="340" cy="120" r="6" data-month="7" data-name="Июль"/>
                <circle class="star-node" cx="400" cy="150" r="6" data-month="6" data-name="Июнь"/>
                <circle class="star-node special" cx="460" cy="120" r="9" data-month="5" data-name="29 мая 2025"/>
                <circle class="star-node" cx="560" cy="190" r="6" data-month="4" data-name="Апрель"/>
                <circle class="star-node" cx="600" cy="310" r="6" data-month="3" data-name="Март"/>
                <circle class="star-node" cx="570" cy="430" r="6" data-month="2" data-name="Февраль"/>
                <circle class="star-node" cx="490" cy="540" r="6" data-month="1" data-name="Январь"/>
            </g>
        </svg>
        
        <div class="star-counter">
            <span id="connected-count">0</span>/12 звёзд
        </div>
        <div class="progress-mini">
            <div class="progress-mini-fill" id="constellation-progress"></div>
        </div>
        
    </section>
    
    <!-- ЭКРАН 2: ПОРТАЛ + ТАЙМЕР -->
    <section id="portal-screen" class="screen">
        
        <div class="portal-wrapper">
            <div class="crystals-orbit">
                <div class="crystal c1"></div>
                <div class="crystal c2"></div>
                <div class="crystal c3"></div>
                <div class="crystal c4"></div>
                <div class="crystal c5"></div>
            </div>
            
            <div class="portal-gate" id="portal-gate">
                <div class="portal-inner">
                    <div class="portal-energy"></div>
                    <div class="portal-seal" id="portal-seal">
                        <span class="seal-text">ЗАПЕЧАТАНО</span>
                        <span class="seal-sub">до 29.05</span>
                    </div>
                </div>
            </div>
            
            <div class="portal-ring"></div>
        </div>
        
        <div class="countdown-box">
            <h2 class="countdown-title">Портал откроется через</h2>
            <div class="countdown-timer">
                <div class="time-block">
                    <span class="time-value" id="days">04</span>
                    <span class="time-label">дня</span>
                </div>
                <span class="time-colon">:</span>
                <div class="time-block">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">часов</span>
                </div>
                <span class="time-colon">:</span>
                <div class="time-block">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">минут</span>
                </div>
                <span class="time-colon">:</span>
                <div class="time-block">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">секунд</span>
                </div>
            </div>
            <div class="daily-message" id="daily-message">✦ Магия накапливается... ✦</div>
        </div>
        
    </section>
    
    <!-- ЭКРАН 3: ВОСПОМИНАНИЯ -->
    <section id="memories-screen" class="screen">
        <div class="memories-container">
            <h1 class="memories-title">Год вместе</h1>
            <p class="memories-subtitle">29 мая 2025 — 29 мая 2026</p>
            
            <div class="timeline">
                <div class="timeline-line"></div>
                <div class="timeline-fill" id="timeline-fill"></div>
                <div class="timeline-moments" id="timeline-moments"></div>
            </div>
            
            <div class="memories-grid" id="memories-grid"></div>
        </div>
    </section>
    
    <!-- IFRAME ДЛЯ ДИАЛОГОВ -->
    <div id="dialog-overlay" class="dialog-overlay hidden">
        <button id="close-dialog" class="close-dialog-btn">✕</button>
        <iframe id="dialog-frame" src="" frameborder="0"></iframe>
    </div>
    
    <audio id="bg-music" loop>
        <source src="#" type="audio/mpeg">
    </audio>
    
    <script src="script.js"></script>
</body>
</html>
