<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>26.05.2026 · Скоро наше второе лето</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="dialog-26-05-2026.css">
</head>
<body>
    
    <!-- Чат -->
    <div id="chat-screen" class="fullscreen-overlay">
        <div class="chat-container">
            
            <div class="chat-header">
                <div class="header-back">←</div>
                <div class="header-avatar">
                    <img src="../photo/lybov.jpg" alt="">
                </div>
                <div class="header-info">
                    <div class="header-name">Сашка💕</div>
                    <div class="header-status">был недавно</div>
                </div>
            </div>
            
            <div class="typing-indicator hidden" id="typing-indicator">
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span class="typing-text">печатает...</span>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-choices" id="chat-choices"></div>
            
        </div>
    </div>
    
    <!-- Колесо судьбы -->
    <div id="wheel-screen" class="fullscreen-overlay hidden">
        <div class="wheel-container">
            <div class="wheel-title">🎡 КОЛЕСО СУДЬБЫ 🎡</div>
            <div class="wheel-subtitle">Тебе надо обязательно выполнить то, что выпадет!</div>
            
            <div class="wheel-wrapper">
                <canvas id="wheel-canvas" width="400" height="400"></canvas>
                <div class="wheel-arrow">▼</div>
            </div>
            
            <button class="spin-btn" id="spin-btn">КРУТИТЬ КОЛЕСО</button>
            <div class="wheel-result hidden" id="wheel-result"></div>
        </div>
    </div>
    
    <script src="dialog-26-05-2026.js"></script>
</body>
</html>
