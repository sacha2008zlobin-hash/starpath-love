<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>01.04.2026 · Первое апреля</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="dialog-01-04-2026.css">
</head>
<body>
    
    <!-- Загрузка -->
    <div id="loading-screen" class="fullscreen-overlay">
        <div class="loading-content">
            <div class="loading-icon">🎮</div>
            <div class="loading-text">Загрузка...</div>
            <div class="loading-bar"><div class="loading-fill"></div></div>
        </div>
    </div>
    
    <!-- Блиц-опрос -->
    <div id="quiz-screen" class="fullscreen-overlay hidden">
        <div class="quiz-container">
            <div class="quiz-header">⚡ БЛИЦ-ОПРОС ⚡</div>
            <div class="quiz-question" id="quiz-question"></div>
            <div class="quiz-options" id="quiz-options"></div>
            <div class="quiz-progress" id="quiz-progress"></div>
        </div>
    </div>
    
    <!-- Чат -->
    <div id="chat-screen" class="fullscreen-overlay hidden">
        <div class="chat-container">
            
            <div class="chat-header">
                <div class="header-back">←</div>
                <div class="header-avatar">
                    <img src="../photo/lybov.jpg" alt="">
                </div>
                <div class="header-info">
                    <div class="header-name">Сашка💕</div>
                    <div class="header-status">был недавно</div>
                </div>
            </div>
            
            <div class="typing-indicator hidden" id="typing-indicator">
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span class="typing-text">печатает...</span>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-choices" id="chat-choices"></div>
            
        </div>
    </div>
    
    <script src="dialog-01-04-2026.js"></script>
</body>
</html>
